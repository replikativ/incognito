version: 2.1

orbs:
  github-cli: circleci/github-cli@1.0
  tools: replikativ/clj-tools@0

jobs:
  setup:
    executor: tools/clojurecli
    parameters:
      setup_cljs:
        type: boolean
        default: false
    steps:
      - restore_cache:
          keys:
            - source-{{ .Branch }}-{{ .Revision }}
            - source-{{ .Branch }}
            - source-
      - checkout
      - save_cache:
          key: source-{{ .Branch }}-{{ .Revision }}
          paths:
            - .git
      - restore_cache:
          keys:
            - deps-{{ checksum "deps.edn" }}
            - deps-
      - run:
          name: resolve deps
          command: clojure -P
      - save_cache:
          key: deps-{{ checksum "deps.edn" }}
          paths:
            - /home/circleci/.m2
      - when:
          condition: <<parameters.setup_cljs>>
          steps:
            - restore_cache:
                keys:
                  - npm-{{ checksum "package-lock.json" }}
                  - npm-
            - run: npm ci
            - save_cache:
                key: npm-{{ checksum "package-lock.json" }}
                paths:
                  - /home/circleci/.npm
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - .m2
            - .npm
            - replikativ
  build:
    executor: tools/clojurecli
    parameters:
      build_cljs:
        type: boolean
        default: false
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: clean
          command: clojure -Sthreads 1 -T:build clean
      - run:
          name: jar
          command: clojure -Sthreads 1 -T:build jar
      - when:
          condition: <<parameters.build_cljs>>
          steps:
            - run:
                name: compile_cljs
                command: npx shadow-cljs compile ci
                no_output_timeout: 5m
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - .m2
            - replikativ

  test:
    executor: tools/clojurecli
    parameters:
      test_cljs:
        type: boolean
        default: false
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: test
          command: clojure -Sthreads 1 -T:build test
          no_output_timeout: 5m
      - when:
          condition: <<parameters.test_cljs>>
          steps:
            - run:
                name: karma_test
                command: ./bin/run-cljstests
                no_output_timeout: 5m
  deploy:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: deploy
          command: clojure -Sthreads 1 -T:build deploy
  release:
    executor: tools/clojurecli
    steps:
      - attach_workspace:
          at: /home/circleci
      - run:
          name: deploy
          command: clojure -Sthreads 1 -T:build release


  # Reflection is a latency cost on the JVM and a correctness cost under
  # native-image, where a reflective call resolves at run time and so works
  # only if the target was registered when the image was built. incognito sits
  # on konserve's serialization path, which Datahike compiles into `dthk`.
  # Gate on our own namespaces only -- a dependency's warnings are real but are
  # not fixable from here.
  reflection:
    docker:
      - image: clojure:temurin-21-tools-deps
    steps:
      - checkout
      - run:
          name: fail on reflective calls
          command: |
            NSES=$(find src -name '*.clj' -o -name '*.cljc' \
                     | sed 's|^src/||; s|\.cljc\?$||; s|/|.|g; s|_|-|g' \
                     | sort -u | sed "s/^/'/" | tr '\n' ' ')
            clojure -M -e "(set! *warn-on-reflection* true)(doseq [n [$NSES]] (require n))(println :loaded)" \
              > /tmp/refl.out 2> /tmp/refl.err || { cat /tmp/refl.err; exit 1; }
            if grep -q '^Reflection warning.*incognito/' /tmp/refl.err; then
              echo "Reflective calls in incognito sources:"
              grep '^Reflection warning.*incognito/' /tmp/refl.err
              echo
              echo "Add a type hint. Under native-image these fail at run time."
              exit 1
            fi
            echo "No reflective calls in incognito sources."

workflows:
  build-test-and-deploy:
    jobs:
      - reflection
      - setup:
          context: clojars-deploy
          setup_cljs: true
      - build:
          context: clojars-deploy
          build_cljs: true
          requires:
            - setup
      - tools/format:
          context: clojars-deploy
          requires:
            - setup
      - test:
          context: clojars-deploy
          test_cljs: true
          requires:
            - build
      - deploy:
          context: clojars-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/format
            - test
      - release:
          context:
            - github-token
          filters:
            branches:
              only: main
          requires:
            - deploy
